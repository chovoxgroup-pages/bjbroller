<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Dice Roller</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111111">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Cyberpunk Material Palette */
            --bg-base: #050505;
            --surface: #111111;
            --primary-cyan: #00f0ff;
            --primary-purple: #bc13fe;
            --text-main: #e0e0e0;
            --text-muted: #888890;
            --border-subtle: #333340;
            
            /* Status Colors */
            --nat20: #ffd700;
            --nat1: #ff3333;
            --danger: #ff0055;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3 {
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 0;
        }

        h1 {
            color: var(--primary-cyan);
            text-align: center;
            font-size: 2rem;
            margin: 0;
            padding: 24px 16px;
            border-bottom: 1px solid var(--primary-purple);
            background: linear-gradient(180deg, rgba(188, 19, 254, 0.1) 0%, transparent 100%);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }

        h2 {
            color: var(--primary-purple);
            font-size: 1.2rem;
            margin-bottom: 20px;
            border-left: 4px solid var(--primary-cyan);
            padding-left: 12px;
        }

        /* Reflowable Layout */
        .main-container {
            display: grid;
            grid-template-columns: 1fr; /* Mobile portrait default */
            gap: 24px;
            padding: 24px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Landscape / Monitor Reflow */
        @media (min-width: 768px) {
            .main-container {
                grid-template-columns: 1fr 1fr;
                align-items: start;
            }
        }

        .card {
            background-color: var(--surface);
            padding: 24px;
            border-radius: 4px;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
        }

        /* Cyberpunk styling lines */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--border-subtle);
            transition: background 0.3s;
        }
        .card:hover::before {
            background: var(--primary-purple);
        }

        /* Material Outline Buttons */
        button {
            background-color: transparent;
            color: var(--primary-cyan);
            border: 1px solid var(--primary-cyan);
            padding: 10px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Roboto', sans-serif;
            font-weight: 500;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }

        button:hover, button:focus {
            background-color: rgba(0, 240, 255, 0.1);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.3);
            outline: none;
        }

        button:active {
            background-color: rgba(0, 240, 255, 0.2);
        }

        /* Purple accent buttons */
        button.accent {
            color: var(--primary-purple);
            border-color: var(--primary-purple);
        }
        button.accent:hover, button.accent:focus {
            background-color: rgba(188, 19, 254, 0.1);
            box-shadow: 0 0 12px rgba(188, 19, 254, 0.3);
        }

        button.danger {
            color: var(--danger);
            border-color: var(--danger);
            padding: 6px 12px;
        }
        button.danger:hover {
            background-color: rgba(255, 0, 85, 0.1);
            box-shadow: 0 0 12px rgba(255, 0, 85, 0.3);
        }

        /* Flex container for dice to wrap beautifully */
        .dice-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .dice-grid button {
            flex: 1 1 calc(33.333% - 12px);
            min-width: 70px;
        }

        /* Material Inputs */
        .input-group {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }
        @media (min-width: 500px) {
            .input-group {
                grid-template-columns: 1fr 1fr;
            }
        }

        input {
            background-color: transparent;
            border: 1px solid var(--border-subtle);
            border-radius: 4px;
            color: var(--text-main);
            font-family: 'Share Tech Mono', monospace;
            font-size: 1rem;
            padding: 12px 16px;
            width: 100%;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        input::placeholder {
            color: var(--text-muted);
            font-family: 'Roboto', sans-serif;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-cyan);
            box-shadow: inset 0 0 0 1px var(--primary-cyan), 0 0 8px rgba(0, 240, 255, 0.2);
        }

        .action-row {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        /* Dynamic Lists */
        .saved-roll {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border: 1px solid var(--border-subtle);
            border-radius: 4px;
            margin-bottom: 8px;
            background: linear-gradient(90deg, rgba(255,255,255,0.02) 0%, transparent 100%);
        }

        .saved-roll strong {
            color: var(--primary-cyan);
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .saved-roll .formula {
            color: var(--text-muted);
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            margin-left: 8px;
        }

        .history-header {
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            margin-bottom: 20px;
        }

        .history-item {
            padding: 16px 0;
            border-bottom: 1px dashed var(--border-subtle);
            animation: slideIn 0.3s ease-out forwards;
        }
        .history-item:last-child {
            border-bottom: none;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .history-item strong {
            color: var(--text-main);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .total {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.8rem;
            color: var(--primary-purple);
            margin-left: auto;
            text-shadow: 0 0 8px rgba(188, 19, 254, 0.4);
        }

        .history-title-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
        }

        .details {
            color: var(--text-muted);
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            display: block;
            margin-top: 8px;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

    <h1>SYS://RPG_DICE_ROLLER</h1>

    <div class="main-container">
        <!-- Controls Column -->
        <div>
            <div class="card">
                <h2>Standard Loadout</h2>
                <div class="dice-grid">
                    <button onclick="rollStandard(4)">d4</button>
                    <button onclick="rollStandard(6)">d6</button>
                    <button onclick="rollStandard(8)">d8</button>
                    <button onclick="rollStandard(10)">d10</button>
                    <button onclick="rollStandard(12)">d12</button>
                    <button onclick="rollStandard(20)">d20</button>
                    <button onclick="rollStandard(100)">d100</button>
                </div>
            </div>

            <div class="card">
                <h2>Custom Parameters</h2>
                <div class="input-group">
                    <input type="text" id="customNameInput" placeholder="Alias (e.g., Fireball)" onkeypress="handleEnter(event)" autocomplete="off" />
                    <input type="text" id="customInput" placeholder="Syntax (e.g., 8d6+4)" onkeypress="handleEnter(event)" autocomplete="off" />
                </div>
                <div class="action-row">
                    <button onclick="rollCustom()">Execute</button>
                    <button class="accent" onclick="saveCustom()">Save to Memory</button>
                </div>
                
                <h3 style="font-size: 1rem; color: var(--primary-cyan); margin-bottom: 12px; margin-top: 24px;">Stored Macros</h3>
                <div id="savedRolls"></div>
            </div>
        </div>

        <!-- History Column -->
        <div class="card">
            <div class="history-header">
                <h2>Telemetry Log</h2>
                <button class="danger" onclick="clearHistory()" style="font-size: 0.8rem;">Purge</button>
            </div>
            <div id="history">
                <p style="color: var(--text-muted); font-style: italic; font-family: 'Share Tech Mono', monospace;" id="emptyHistoryMsg">> Awaiting input...</p>
            </div>
        </div>
    </div>

    <script>
        // --- DOM Elements ---
        const historyEl = document.getElementById('history');
        const savedRollsEl = document.getElementById('savedRolls');
        const customNameInput = document.getElementById('customNameInput');
        const customInput = document.getElementById('customInput');
        const emptyHistoryMsg = document.getElementById('emptyHistoryMsg');

        // --- State ---
        let savedRolls = JSON.parse(localStorage.getItem('rpgSavedRolls')) || [];
        
        // Data migration: convert old string-only saves to object format {name, formula}
        savedRolls = savedRolls.map(roll => {
            if (typeof roll === 'string') {
                return { name: roll, formula: roll };
            }
            return roll;
        });

        let rollHistoryCount = 0;

        // --- Initialization ---
        renderSaved();

        // --- Functions ---
        function renderSaved() {
            savedRollsEl.innerHTML = '';
            if (savedRolls.length === 0) {
                savedRollsEl.innerHTML = '<p style="color: var(--text-muted); font-style: italic; font-family: \'Share Tech Mono\', monospace;">> No macros found.</p>';
                return;
            }

            savedRolls.forEach((roll, index) => {
                const div = document.createElement('div');
                div.className = 'saved-roll';
                const safeName = roll.name.replace(/'/g, "\\'");
                div.innerHTML = `
                    <div>
                        <strong>${roll.name}</strong> 
                        <span class="formula">[${roll.formula}]</span>
                    </div>
                    <div style="display: flex; gap: 8px;">
                        <button onclick="executeCustom('${roll.formula}', '${safeName}')">Run</button>
                        <button class="danger" onclick="deleteCustom(${index})">X</button>
                    </div>
                `;
                savedRollsEl.appendChild(div);
            });
        }

        function saveCustom() {
            const formula = customInput.value.trim().toLowerCase();
            const name = customNameInput.value.trim() || formula; 

            if (formula) {
                if(validateNotation(formula)) {
                    savedRolls.push({ name: name, formula: formula });
                    localStorage.setItem('rpgSavedRolls', JSON.stringify(savedRolls));
                    renderSaved();
                    customInput.value = ''; 
                    customNameInput.value = '';
                } else {
                    alert("Syntax Error! Use NdS+M (e.g., 2d6+3 or d20)");
                }
            }
        }

        function deleteCustom(index) {
            savedRolls.splice(index, 1);
            localStorage.setItem('rpgSavedRolls', JSON.stringify(savedRolls));
            renderSaved();
        }

        function rollStandard(sides) {
            executeCustom(`1d${sides}`);
        }

        function rollCustom() {
            const formula = customInput.value.trim().toLowerCase();
            const name = customNameInput.value.trim();
            if (formula) executeCustom(formula, name || null);
        }

        function handleEnter(e) {
            if (e.key === 'Enter') {
                rollCustom();
            }
        }

        function validateNotation(notation) {
            const regex = /^(\d+)?d(\d+)([+-]\d+)?$/;
            return regex.test(notation.replace(/\s+/g, ''));
        }

        function executeCustom(notation, customName = null) {
            const regex = /^(\d+)?d(\d+)([+-]\d+)?$/;
            const match = notation.replace(/\s+/g, '').match(regex);

            if (!match) {
                alert("Syntax Error! Use NdS+M (e.g., 3d8+2 or d20)");
                return;
            }

            const count = parseInt(match[1]) || 1;
            const sides = parseInt(match[2]);
            const modifier = match[3] ? parseInt(match[3]) : 0;

            if (count > 1000) {
                alert("Overload! Keep payload under 1,000 dice.");
                return;
            }

            let rolls = [];
            let total = 0;
            
            for (let i = 0; i < count; i++) {
                const r = Math.floor(Math.random() * sides) + 1;
                rolls.push(r);
                total += r;
            }
            total += modifier;

            let isNat20 = false;
            let isNat1 = false;

            if (count === 1 && sides === 20) {
                if (rolls[0] === 20) {
                    isNat20 = true;
                } else if (rolls[0] === 1) {
                    isNat1 = true;
                }
            }
            
            const displayTitle = customName && customName !== notation ? `${customName} (${notation})` : notation;

            addHistory(displayTitle, rolls, modifier, total, isNat20, isNat1);
        }

        function addHistory(title, rolls, modifier, total, isNat20, isNat1) {
            if (rollHistoryCount === 0 && emptyHistoryMsg) {
                emptyHistoryMsg.style.display = 'none';
            }

            const modStr = modifier !== 0 ? (modifier > 0 ? ` +${modifier}` : ` ${modifier}`) : '';
            
            let rollsStr = rolls.join(', ');
            if(rolls.length > 20) {
                rollsStr = rolls.slice(0, 20).join(', ') + ` ... (+${rolls.length - 20} more)`;
            }

            const detail = `[${rollsStr}]${modStr}`;

            let totalStyle = '';
            if (isNat20) {
                totalStyle = 'color: var(--nat20); text-shadow: 0 0 12px rgba(255, 215, 0, 0.7); font-weight: bold;'; 
            } else if (isNat1) {
                totalStyle = 'color: var(--nat1); text-shadow: 0 0 12px rgba(255, 51, 51, 0.7); font-weight: bold;'; 
            }

            const div = document.createElement('div');
            div.className = 'history-item';
            div.innerHTML = `
                <div class="history-title-row">
                    <strong>${title}</strong> 
                    <span class="total" style="${totalStyle}">${total}</span>
                </div>
                <span class="details">${detail}</span>
            `;
            
            historyEl.prepend(div);
            rollHistoryCount++;
        }

        function clearHistory() {
            historyEl.innerHTML = '<p style="color: var(--text-muted); font-style: italic; font-family: \'Share Tech Mono\', monospace;" id="emptyHistoryMsg">> Awaiting input...</p>';
            rollHistoryCount = 0;
        }
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registered'))
                    .catch(err => console.log('Service Worker failed', err));
            });
        }
    </script>
</body>
</html>
