<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Dice Roller</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Google Fonts for Cyberpunk Aesthetic -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Space+Mono:wght+400;700&display=swap" rel="stylesheet">
    <style>
        /* Custom Styles for Cyberpunk/Dark Theme */
        :root {
            --color-primary: #a855f7; /* Purple */
            --color-accent: #06b6d4; /* Cyan */
        }

        body {
            font-family: 'Space Mono', monospace;
            background-color: #111827; /* Dark Gray BG */
            color: #d1d5db; /* Light text (Standard Text Color) */
            min-height: 100vh;
        }

        h1, h2, h3 {
            font-family: 'Orbitron', sans-serif;
            color: var(--color-accent);
        }

        /* Neon Glow Effect for Buttons */
        .dice-btn {
            transition: all 0.1s ease;
            box-shadow: 0 0 5px var(--color-primary), 0 0 10px var(--color-primary);
            border: 1px solid var(--color-primary);
        }

        .dice-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 10px var(--color-primary), 0 0 20px var(--color-primary), 0 0 30px var(--color-primary);
        }

        .dice-btn:active {
            transform: translateY(0);
            box-shadow: 0 0 5px var(--color-primary);
        }
        
        /* Highlighting for selected die button */
        .dice-btn.selected {
            background-color: #f0abfc; /* Light Purple */
            color: #111827 !important;
            box-shadow: 0 0 15px #f0abfc, 0 0 25px #f0abfc !important;
            border: 2px solid #a855f7 !important;
        }

        /* Highlight box for results and history */
        .data-panel {
            background-color: #1f2937; /* Even darker blue-gray */
            border: 1px solid #374151;
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.3); /* Soft cyan glow */
        }

        /* History items glow on hover */
        .history-item:hover {
            background-color: #374151;
            transition: background-color 0.2s;
        }

        /* Custom roll and input style */
        .cyber-input {
            background-color: #111827;
            border: 2px solid var(--color-accent);
            color: #f3f4f6;
            transition: border-color 0.2s;
        }

        .cyber-input:focus {
            border-color: var(--color-primary);
            outline: none;
            box-shadow: 0 0 5px var(--color-primary);
        }
        
        /* Special style for HTML in breakdown */
        /* RULE 1: Roll Name (<strong>) is now PURPLE */
        #breakdownOutput strong {
            color: var(--color-primary); 
            font-weight: 700;
        }
        /* RULE 2: Formula (<em>) is now NORMAL TEXT */
        #breakdownOutput em {
            color: currentColor; 
            font-style: italic;
        }

    </style>
</head>
<body class="p-4 flex flex-col items-center">

    <div class="w-full max-w-4xl space-y-8">
        <!-- Header -->
        <header class="text-center pt-4 pb-2">
            <h1 class="text-5xl font-bold uppercase tracking-widest text-shadow-lg">
                <span class="text-fuchsia-400">CYBER</span>-ROLL
            </h1>
            <p class="text-sm text-gray-400 mt-2">v1.6 | Named Compound Roll Breakdown</p>
        </header>

        <!-- Main Rolling Section -->
        <section class="data-panel p-6 rounded-xl">
            <h2 class="text-2xl mb-4 font-bold border-b border-gray-700 pb-2 bg-clip-text text-fuchsia-400">Select Die (Y)</h2>

            <!-- Dice Button Grid (now selectors) -->
            <div id="diceSelectors" class="grid grid-cols-4 md:grid-cols-7 gap-3 mb-6">
                <!-- d4 -->
                <button id="d4" onclick="setDieSize(4)" class="dice-btn bg-purple-700/50 text-white font-bold py-3 rounded-lg text-xl">d4</button>
                <!-- d6 -->
                <button id="d6" onclick="setDieSize(6)" class="dice-btn bg-purple-700/50 text-white font-bold py-3 rounded-lg text-xl">d6</button>
                <!-- d8 -->
                <button id="d8" onclick="setDieSize(8)" class="dice-btn bg-purple-700/50 text-white font-bold py-3 rounded-lg text-xl">d8</button>
                <!-- d10 -->
                <button id="d10" onclick="setDieSize(10)" class="dice-btn bg-purple-700/50 text-white font-bold py-3 rounded-lg text-xl">d10</button>
                <!-- d12 -->
                <button id="d12" onclick="setDieSize(12)" class="dice-btn bg-purple-700/50 text-white font-bold py-3 rounded-lg text-xl">d12</button>
                <!-- d20 (Critical) - Selected by default -->
                <button id="d20" onclick="setDieSize(20)" class="dice-btn bg-cyan-700/50 text-white font-bold py-3 rounded-lg text-xl selected">d20</button>
                <!-- d100 (Percentage) -->
                <button id="d100" onclick="setDieSize(100)" class="dice-btn bg-fuchsia-700/50 text-white font-bold py-3 rounded-lg text-xl">d100</button>
            </div>

            <h2 class="text-2xl mb-4 font-bold border-b border-gray-700 pb-2 text-cyan-400">Configure Roll (XdY+Z)</h2>

            <!-- Inputs for X (Number of Dice) and Z (Modifier) -->
            <div class="flex flex-col sm:flex-row gap-3 mb-6 items-stretch sm:items-end">
                <!-- Number of Dice (X) -->
                <div class="flex-1 w-full">
                    <label for="numDiceInput" class="text-sm text-gray-400 block mb-1">Number of Dice (X)</label>
                    <input type="number" id="numDiceInput" value="1" min="1" class="cyber-input w-full p-3 rounded-lg" placeholder="1">
                    <!-- Control Buttons for X -->
                    <div class="flex justify-between mt-2 space-x-1">
                        <button onclick="updateNumDice(-1)" class="dice-btn w-1/3 bg-gray-700/50 hover:bg-gray-600 py-1 rounded-lg text-sm transition text-fuchsia-400 font-bold"> - </button>
                        <button onclick="resetNumDice()" class="dice-btn w-1/3 bg-gray-700/50 hover:bg-gray-600 py-1 rounded-lg text-sm transition text-cyan-400 font-bold"> Reset </button>
                        <button onclick="updateNumDice(1)" class="dice-btn w-1/3 bg-gray-700/50 hover:bg-gray-600 py-1 rounded-lg text-sm transition text-fuchsia-400 font-bold"> + </button>
                    </div>
                </div>
                <!-- Die Size (Y) Display -->
                <div class="flex-1 w-full text-center">
                     <label class="text-sm text-gray-400 block mb-1">Selected Die Size (Y)</label>
                     <div id="selectedDieDisplay" class="text-2xl font-bold font-orbitron text-fuchsia-400 p-3 border-2 border-dashed border-fuchsia-400/50 rounded-lg h-full flex items-center justify-center">d20</div>
                </div>
                <!-- Modifier (Z) -->
                <div class="flex-1 w-full">
                    <label for="modifierInput" class="text-sm text-gray-400 block mb-1">Modifier (Z)</label>
                    <input type="number" id="modifierInput" value="0" class="cyber-input w-full p-3 rounded-lg" placeholder="0">
                    <!-- Control Buttons for Z -->
                    <div class="flex justify-between mt-2 space-x-1">
                        <button onclick="updateModifier(-1)" class="dice-btn w-1/3 bg-gray-700/50 hover:bg-gray-600 py-1 rounded-lg text-sm transition text-fuchsia-400 font-bold"> - </button>
                        <button onclick="resetModifier()" class="dice-btn w-1/3 bg-gray-700/50 hover:bg-gray-600 py-1 rounded-lg text-sm transition text-cyan-400 font-bold"> Reset </button>
                        <button onclick="updateModifier(1)" class="dice-btn w-1/3 bg-gray-700/50 hover:bg-gray-600 py-1 rounded-lg text-sm transition text-fuchsia-400 font-bold"> + </button>
                    </div>
                </div>
            </div>
            
            <!-- Relocated and Centered EXECUTE ROLL Button for XdY+Z + Macros -->
            <div class="flex justify-center mb-6 pt-4 border-t border-gray-700">
                <button id="executeStandardRollBtn" class="dice-btn bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 px-10 rounded-lg text-xl uppercase tracking-wider">
                    EXECUTE ROLL (XdY+Z + Macros)
                </button>
            </div>
            
            <!-- Custom Roll Input & Macro Section -->
            <h2 class="text-2xl mb-4 font-bold border-b border-gray-700 pb-2 text-cyan-400 mt-6">Custom Roll & Macros</h2>
            
            <!-- New: Macro Name Input -->
            <div class="mb-3">
                <label for="macroNameInput" class="text-sm text-gray-400 block mb-1">Macro Name (Optional)</label>
                <input type="text" id="macroNameInput" class="cyber-input w-full p-3 rounded-lg" placeholder="e.g., Sneak Attack or Main Weapon">
            </div>

            <!-- Custom Roll Input & Instant Roll Button -->
            <div class="flex flex-col sm:flex-row gap-3 mb-4">
                <input type="text" id="customRollInput" placeholder="e.g., 2d6 + 5 or 1d20 - 2" class="cyber-input flex-grow p-3 rounded-lg placeholder-gray-500">
                <button onclick="handleAdvancedRoll()" class="dice-btn bg-purple-700/50 text-white font-bold py-3 px-6 rounded-lg whitespace-nowrap">Roll Now</button>
            </div>
            
            <!-- Save as Macro Button -->
            <div class="flex justify-end mb-6">
                <button onclick="saveMacroFromInput()" id="saveMacroBtn" class="bg-gray-700 hover:bg-gray-600 text-xs text-white px-3 py-1 rounded-lg border border-gray-500 transition duration-150">
                    Save as Macro
                </button>
            </div>


            <!-- Saved Macros List -->
            <h3 class="text-lg font-bold text-fuchsia-400 mt-6 mb-3 border-b border-gray-800 pb-1">Saved Macros (Toggle to compound roll)</h3>
            <div id="macroList" class="space-y-2 max-h-40 overflow-y-auto">
                <!-- Initial loading state -->
                <p class="text-gray-500 text-center py-2" id="loadingMacros">Loading saved macros...</p>
            </div>

            <!-- NEW: Dedicated Button for Custom Roll Input and Checked Macros -->
            <div class="flex justify-center mt-6 pt-4 border-t border-gray-700">
                <button id="executeMacroRollBtn" class="dice-btn bg-fuchsia-600 hover:bg-fuchsia-500 text-white font-bold py-3 px-10 rounded-lg text-xl uppercase tracking-wider">
                    EXECUTE CUSTOM & MACRO ROLL
                </button>
            </div>


        </section>

        <!-- Results Display -->
        <section class="data-panel p-6 rounded-xl">
            <h2 class="text-2xl mb-4 font-bold border-b border-gray-700 pb-2 text-fuchsia-400">Current Result</h2>
            <div id="resultOutput" class="text-center">
                <p class="text-5xl font-extrabold text-cyan-400 font-orbitron tracking-wider">0</p>
                <p id="breakdownOutput" class="text-md text-gray-400 mt-2 italic">Select a die and roll!</p>
            </div>
        </section>

        <!-- Roll History Section -->
        <section class="data-panel p-6 rounded-xl mb-8">
            <h2 class="text-2xl mb-4 font-bold border-b border-gray-700 pb-2 text-cyan-400">Roll History</h2>
            <div class="max-h-80 overflow-y-auto space-y-2" id="historyList">
                <p class="text-gray-500 text-center py-4" id="loadingHistory">Loading history...</p>
            </div>
            <p class="text-xs text-right text-gray-600 mt-4">User ID: <span id="userIdDisplay">N/A</span></p>
        </section>
    </div>

    <!-- Firebase Imports and Setup Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, onSnapshot, serverTimestamp, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global variables provided by the environment
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let db, auth, userId = null;
        let currentDieSize = 20; // Default selection
        const MACROS_COLLECTION = 'custom_macros';
        const HISTORY_COLLECTION = 'roll_history';
        
        // --- UPDATED COLOR CONSTANTS FOR BREAKDOWN ---
        const COLOR_PURPLE_PRIMARY = '#a855f7'; 
        const COLOR_CYAN_ACCENT = '#06b6d4';   
        
        // --- Core Firebase Initialization and Authentication ---

        const initFirebase = async () => {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                // Sign in using custom token or anonymously
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }

                // Wait for auth state to be confirmed
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        userId = user.uid;
                        document.getElementById('userIdDisplay').textContent = userId;
                        console.log("Firebase Auth Ready. User ID:", userId);
                        // Start loading persistence once authenticated
                        loadHistory();
                        loadMacros();
                    } else {
                        console.log("User logged out or not authenticated.");
                    }
                });

            } catch (error) {
                console.error("Firebase Initialization/Auth Error:", error);
                document.getElementById('loadingHistory').textContent = 'Error loading history. See console.';
            }
        };

        initFirebase();

        // --- Dice Rolling Logic ---

        /**
         * Rolls a standard die (1 to max).
         * @param {number} max - The max value of the die (e.g., 20 for d20).
         * @returns {number} The roll result.
         */
        function rollDie(max) {
            return Math.floor(Math.random() * max) + 1;
        }

        /**
         * Rolls a specific number of dice and a modifier.
         * @param {number} numDice - Number of dice (X).
         * @param {number} dieSize - Size of the die (Y).
         * @param {number} modifier - Modifier (Z).
         * @returns {{total: number, breakdown: string}}
         */
        function rollAndCalculate(numDice, dieSize, modifier) {
            let rolls = [];
            let sum = 0;
            for (let i = 0; i < numDice; i++) {
                const roll = rollDie(dieSize);
                rolls.push(roll);
                sum += roll;
            }

            const total = sum + modifier;
            
            // --- UPDATED BREAKDOWN LOGIC ---
            
            // 1. Rolls Array: Uses PURPLE for the individual roll values
            let breakdown = `<span style="color: ${COLOR_PURPLE_PRIMARY};">[${rolls.join(' + ')}]</span>`; 
            
            // 2. Modifier: The operator and number use 'currentColor' (Normal Text)
            if (modifier !== 0) {
                breakdown += ` <span style="color: currentColor;">${modifier >= 0 ? '+' : '-'} ${Math.abs(modifier)}</span>`;
            }

            // 3. Equals Sign: Uses 'currentColor' (Normal Text)
            breakdown += ` <span style="color: currentColor;">=</span> `; 

            // 4. Final Total: Uses CYAN for the final calculated number
            breakdown += `<span style="color: ${COLOR_CYAN_ACCENT}; font-weight: bold;">${total}</span>`; 

            return { total, breakdown, rolls, formulaSum: sum };
        }

        /**
         * Parses a custom roll string (e.g., "2d6 + 5").
         * @param {string} input - The user input string.
         * @returns {{numDice: number, dieSize: number, modifier: number, success: boolean}}
         */
        function parseCustomRollString(input) {
            // Trim and sanitize input
            input = input.toLowerCase().replace(/\s/g, '');

            // Regex to match: [X]d[Y] [+/-] [Z]
            // The match[3] group is optional, representing the modifier
            const match = input.match(/^(\d*)d(\d+)([\+\-]\d+)?$/);

            if (!match) {
                return { success: false };
            }

            // If match[1] is empty (e.g., 'd20'), default numDice to 1
            const numDice = parseInt(match[1] || '1', 10); 
            const dieSize = parseInt(match[2], 10);
            const modifier = match[3] ? parseInt(match[3], 10) : 0;

            if (dieSize < 2 || numDice < 1) {
                return { success: false };
            }

            return { numDice, dieSize, modifier, success: true };
        }

        // --- Helper functions for X and Z inputs ---

        /**
         * Updates the number of dice (X) input value.
         * @param {number} delta - Amount to change the value by (+1 or -1).
         */
        window.updateNumDice = function(delta) {
            const inputEl = document.getElementById('numDiceInput');
            let currentValue = parseInt(inputEl.value, 10) || 0;
            currentValue += delta;
            // Enforce minimum of 1
            if (currentValue < 1) {
                currentValue = 1;
            }
            inputEl.value = currentValue;
        }

        /**
         * Resets the number of dice (X) input value to 1.
         */
        window.resetNumDice = function() {
            document.getElementById('numDiceInput').value = 1;
        }

        /**
         * Updates the modifier (Z) input value.
         * @param {number} delta - Amount to change the value by (+1 or -1).
         */
        window.updateModifier = function(delta) {
            const inputEl = document.getElementById('modifierInput');
            let currentValue = parseInt(inputEl.value, 10) || 0;
            currentValue += delta;
            // No minimum/maximum enforced for modifier
            inputEl.value = currentValue;
        }

        /**
         * Resets the modifier (Z) input value to 0.
         */
        window.resetModifier = function() {
            document.getElementById('modifierInput').value = 0;
        }

        // --- UI and Persistence Functions ---

        /**
         * Saves a roll result to Firestore (for history).
         * @param {number} total - Final roll result.
         * @param {string} formula - The input formula (e.g., "d20" or "2d6+5").
         * @param {string} breakdown - The detailed calculation (now includes HTML styling).
         */
        async function saveRoll(total, formula, breakdown) {
            if (!userId || !db) {
                console.warn("Firestore not ready or user not authenticated. Roll not saved.");
                return;
            }

            // Using segmented collection reference for robustness
            const historyRef = collection(db, 'artifacts', appId, 'users', userId, HISTORY_COLLECTION);
            
            try {
                await addDoc(historyRef, {
                    total: total,
                    formula: formula,
                    // Save the styled breakdown string
                    breakdown: breakdown, 
                    timestamp: serverTimestamp(),
                });
                // console.log("Roll saved successfully.");
            } catch (e) {
                console.error("Error adding history document: ", e);
            }
        }

        /**
         * Updates the UI with the latest roll result.
         * @param {number|string} total - Final roll result or error message.
         * @param {string} formula - The input formula.
         * @param {string} breakdown - The detailed calculation/error detail (contains HTML for coloring).
         */
        function updateResultUI(total, formula, breakdown) {
            const resultEl = document.getElementById('resultOutput').querySelector('p');
            const breakdownEl = document.getElementById('breakdownOutput');

            // Set content
            resultEl.textContent = total;
            
            // For ALL rolls, we use innerHTML now because rollAndCalculate returns styled HTML or we pass a styled compound breakdown
            if (formula.includes('[COMPOUND]')) {
                // Compound roll breakdown is already fully formatted HTML
                breakdownEl.innerHTML = breakdown;
            } else if (formula.includes('N/A')) {
                // Error/Instructional messages
                breakdownEl.innerHTML = breakdown; 
            } else {
                 // Standard or simple macro roll: Wrap breakdown with roll name and formula
                 // The <strong> (Roll Name) is styled PURPLE by CSS.
                 // The <em> (Formula) is explicitly set to currentColor (Normal Text) here.
                 breakdownEl.innerHTML = `<strong>Standard Roll</strong> (<em style="color: currentColor;">${formula}</em>)<span style="color: currentColor;">:</span> ${breakdown}`;
            }

            // Reset classes
            resultEl.classList.remove('text-green-400', 'text-red-400', 'text-cyan-400', 'text-fuchsia-400');

            if (typeof total === 'string' || isNaN(total)) {
                 resultEl.classList.add('text-red-400'); // Error color
                 return;
            }

            // Apply critical/fumble color logic for 1d20 rolls ONLY when not a compound roll
            if (formula.toLowerCase() === '1d20+0') {
                if (total === 20) {
                    resultEl.classList.add('text-green-400'); // Critical Success
                } else if (total === 1) {
                    resultEl.classList.add('text-red-400'); // Critical Fumble
                } else {
                    resultEl.classList.add('text-cyan-400');
                }
            } else if (formula.includes('[COMPOUND]')) {
                 resultEl.classList.add('text-fuchsia-400'); // Special color for compound rolls (Purple)
            } else {
                resultEl.classList.add('text-cyan-400'); // Default color (Cyan)
            }
        }
        
        // --- Custom Macro Functions ---

        /**
         * Saves a roll formula as a macro to Firestore.
         * @param {string} name - The user-defined name for the macro.
         * @param {string} formula - The dice notation formula (e.g., "2d6+5").
         */
        async function saveMacro(name, formula) {
            if (!userId || !db) {
                console.warn("Firestore not ready. Cannot save macro.");
                return;
            }

            const macroRef = collection(db, 'artifacts', appId, 'users', userId, MACROS_COLLECTION);
            try {
                await addDoc(macroRef, {
                    name: name || formula, // Use formula as default name if none provided
                    formula: formula,
                    timestamp: serverTimestamp(),
                });
                document.getElementById('customRollInput').value = ''; // Clear formula input
                document.getElementById('macroNameInput').value = ''; // Clear name input
                console.log(`Macro saved: ${name || formula}`);
            } catch (e) {
                console.error("Error adding macro: ", e);
                updateResultUI('ERROR', 'Macro Save Failed', 'Could not save macro to database.');
            }
        }

        /**
         * Deletes a macro from Firestore using a robust segmented path.
         * @param {string} macroId - The ID of the document to delete.
         */
        window.deleteMacro = async function(macroId) {
            if (!userId || !db) return;

            // Use segmented path for robustness
            const macroDocRef = doc(db, 
                'artifacts', appId, 
                'users', userId, 
                MACROS_COLLECTION, macroId
            );

            try {
                await deleteDoc(macroDocRef); 
                console.log(`Macro deleted: ${macroId}`);
            } catch (e) {
                console.error("Error deleting macro: ", e);
                updateResultUI('ERROR', 'Macro Deletion Failed', 'Could not delete macro. See console for details.');
            }
        }

        /**
         * Takes the current custom roll input, validates it, and saves it as a macro.
         */
        window.saveMacroFromInput = function() {
            const input = document.getElementById('customRollInput').value;
            const name = document.getElementById('macroNameInput').value.trim(); // Get name
            const parsed = parseCustomRollString(input);

            if (!parsed.success) {
                updateResultUI('INVALID', 'Macro Save Failed', 'Invalid formula. Use XdY+Z format (e.g., 2d6+5 or d20).');
                return;
            }
            
            // Normalize formula before saving (e.g., ensure it has +0 if no modifier)
            const formula = `${parsed.numDice}d${parsed.dieSize}${parsed.modifier >= 0 ? '+' : ''}${parsed.modifier}`;
            saveMacro(name, formula); // Pass name to saveMacro
        }


        /**
         * Rolls a formula retrieved from a saved macro.
         * @param {string} formula - The dice notation formula to roll.
         */
        window.rollSavedMacro = function(formula) {
            const parsed = parseCustomRollString(formula);

            if (!parsed.success) {
                updateResultUI('ERROR', formula, 'Macro Roll Failed: Invalid stored format.');
                return;
            }

            const { total, breakdown } = rollAndCalculate(parsed.numDice, parsed.dieSize, parsed.modifier);

            // Use updateResultUI, passing the formula twice to get the non-compound formatting
            updateResultUI(total, formula, breakdown); 
            saveRoll(total, formula, breakdown); // Save to roll history
        }


        /**
         * Renders the list of saved macros to the UI.
         * @param {Array<Object>} macros - Array of macro objects from Firestore.
         */
        function renderMacros(macros) {
            const macroListEl = document.getElementById('macroList');
            // By clearing innerHTML, we remove the initial <p id="loadingMacros"> element.
            macroListEl.innerHTML = ''; 

            if (macros.length === 0) {
                // If the snapshot has no documents, display the "No macros" message.
                macroListEl.innerHTML = '<p class="text-gray-500 text-center py-2">No macros saved yet. Use the input field above.</p>';
                return;
            }

            // If there are macros, populate the list.
            macros.forEach(macro => {
                const item = document.createElement('div');
                // Added flex-nowrap to prevent button wrap on small screens
                item.className = 'flex justify-between items-center p-2 bg-gray-800/50 rounded-lg border border-gray-700/70 hover:border-cyan-400 transition duration-150 flex-nowrap';
                
                // Name and formula for display
                const macroName = macro.name || macro.formula;
                const macroFormula = macro.formula;

                item.innerHTML = `
                    <div class="flex items-center space-x-3 flex-shrink-0 min-w-0">
                        <!-- Checkbox to include in EXECUTE ROLL. Data attributes store both formula and name. -->
                        <input type="checkbox" 
                               class="h-5 w-5 text-fuchsia-400 rounded border-gray-600 bg-gray-900 focus:ring-fuchsia-500 macro-toggle" 
                               data-formula="${macroFormula}"
                               data-macro-name="${macroName}">
                        <!-- Macro Name and Formula Display -->
                        <div class="flex flex-col sm:flex-row sm:space-x-2 items-start sm:items-baseline min-w-0">
                            <!-- Name: Bold, Fuchsia-300 (Macro Name color) -->
                            <!-- Note: The <strong> tag here will take its color from the #breakdownOutput strong CSS style (PURPLE) -->
                            <strong class="text-md font-bold text-fuchsia-300 truncate">${macroName}</strong> 
                            <!-- Formula: Italic, Gray-300 (Normal Text color) -->
                            <em class="text-sm text-gray-300 italic font-mono truncate">${macroFormula}</em>
                        </div>
                    </div>
                    
                    <div class="flex space-x-2 flex-shrink-0 ml-4">
                        <!-- Individual Roll Button -->
                        <button onclick="rollSavedMacro('${macroFormula}')" 
                                class="bg-cyan-600 hover:bg-cyan-500 text-white px-3 py-1 text-sm rounded-md transition duration-150 shadow-md">
                            Roll
                        </button>
                        <!-- Delete Button -->
                        <button onclick="deleteMacro('${macro.id}')"
                                class="text-red-400 hover:text-red-300 px-1 text-lg leading-none transition duration-150"
                                title="Delete Macro">
                            &times;
                        </button>
                    </div>
                `;
                macroListEl.appendChild(item);
            });
        }

        /**
         * Sets up the real-time listener for custom macros.
         */
        function loadMacros() {
            if (!db || !userId) {
                console.error("Database or User ID not available for macro loading.");
                return;
            }

            const macroCollectionRef = collection(db, 'artifacts', appId, 'users', userId, MACROS_COLLECTION);
            const macrosQuery = query(macroCollectionRef);

            onSnapshot(macrosQuery, (snapshot) => {
                const macros = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    macros.push({ ...data, id: doc.id });
                });

                // Sort by timestamp (newest first)
                macros.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));

                renderMacros(macros);
            }, (error) => {
                console.error("Error listening to macro changes:", error);
                document.getElementById('macroList').innerHTML = '<p class="text-gray-500 text-center py-2">Error loading macros. Check connection.</p>';
            });
        }

        // --- Core Functionality ---

        /**
         * Sets the currently selected die size and updates the UI highlighting.
         * @param {number} size - The max value of the die (Y).
         */
        window.setDieSize = function(size) {
            currentDieSize = size;
            document.getElementById('selectedDieDisplay').textContent = `d${size}`;

            // Remove 'selected' class from all buttons
            const buttons = document.querySelectorAll('#diceSelectors .dice-btn');
            buttons.forEach(btn => btn.classList.remove('selected'));

            // Add 'selected' class to the clicked button
            const selectedBtn = document.getElementById(`d${size}`);
            if (selectedBtn) {
                selectedBtn.classList.add('selected');
            }
        }

        /**
         * Handles the standard roll using the selected die size (Y) and input X and Z values,
         * and adds results from any checked macros. (Called by the top EXECUTE ROLL button).
         */
        window.handleStandardCompoundRoll = function() {
            let combinedTotal = 0;
            let combinedBreakdown = [];
            let fullFormula = ''; 
            const toggledMacros = document.querySelectorAll('.macro-toggle:checked');

            // 1. Perform Standard Roll (XdY+Z)
            const numDice = parseInt(document.getElementById('numDiceInput').value, 10) || 1;
            const modifier = parseInt(document.getElementById('modifierInput').value, 10) || 0;
            const dieSize = currentDieSize;

            if (numDice < 1 || dieSize < 2) {
                updateResultUI('INVALID', 'N/A', 'Please ensure Number of Dice (X) is 1 or more.');
                return;
            }

            const standardFormula = `${numDice}d${dieSize}${modifier >= 0 ? '+' : ''}${modifier}`;
            const standardRoll = rollAndCalculate(numDice, dieSize, modifier);

            combinedTotal += standardRoll.total;
            fullFormula = standardFormula; // Start with standard formula
            
            // Generate detailed breakdown string for standard roll
            let standardRollBreakdownPart;
            if (toggledMacros.length > 0) {
                // For compound rolls, use rich HTML breakdown for the first part
                // <strong> (Roll Name) is Purple via CSS, <em> (Formula) is Normal Text via inline style.
                standardRollBreakdownPart = `<strong>Standard Roll</strong> (<em style="color: currentColor;">${standardFormula}</em>)<span style="color: currentColor;">:</span> ${standardRoll.breakdown}`;
            } else {
                // For non-compound rolls, use the breakdown directly (which now includes HTML)
                standardRollBreakdownPart = standardRoll.breakdown;
            }

            combinedBreakdown.push(standardRollBreakdownPart);


            // 2. Process Toggled Macros
            toggledMacros.forEach((checkbox) => {
                const macroFormula = checkbox.getAttribute('data-formula');
                const macroName = checkbox.getAttribute('data-macro-name'); 
                const parsed = parseCustomRollString(macroFormula);

                if (parsed.success) {
                    const macroRoll = rollAndCalculate(parsed.numDice, parsed.dieSize, parsed.modifier);
                    
                    fullFormula += ` + (${macroFormula})`; // Append macro formula to the overall formula
                    combinedTotal += macroRoll.total;
                    
                    // Generate detailed breakdown string for macro roll
                    const macroBreakdownPart = `<strong>${macroName}</strong> (<em style="color: currentColor;">${macroFormula}</em>)<span style="color: currentColor;">:</span> ${macroRoll.breakdown}`;
                    combinedBreakdown.push(macroBreakdownPart);

                } else {
                    console.error("Invalid macro formula skipped:", macroFormula);
                }
            });

            // 3. Update UI and Save History
            
            const historyFormula = fullFormula + (toggledMacros.length > 0 ? ' [COMPOUND]' : '');
            // Join parts with pipe only if compound roll is happening
            const finalBreakdown = combinedBreakdown.length > 1 ? combinedBreakdown.join(' <span style="color: currentColor;">|</span> ') : combinedBreakdown[0];

            updateResultUI(combinedTotal, historyFormula, finalBreakdown);
            saveRoll(combinedTotal, historyFormula, finalBreakdown);
        }
        
        /**
         * Executes a compound roll based ONLY on the Custom Roll Input and/or checked Macros.
         * This function is for the new button at the bottom of the Macro section.
         */
        window.handleCustomMacroExecution = function() {
            let combinedTotal = 0;
            let combinedBreakdown = [];
            let fullFormula = ''; 
            let rollExecuted = false;

            const customRollInputEl = document.getElementById('customRollInput');
            const customRollInput = customRollInputEl.value.trim();
            const toggledMacros = document.querySelectorAll('.macro-toggle:checked');

            // 1. Process Custom Roll Input (if present and valid)
            if (customRollInput) {
                const parsed = parseCustomRollString(customRollInput);
                if (parsed.success) {
                    const formula = `${parsed.numDice}d${parsed.dieSize}${parsed.modifier >= 0 ? '+' : ''}${parsed.modifier}`;
                    const rollResult = rollAndCalculate(parsed.numDice, parsed.dieSize, parsed.modifier);

                    combinedTotal += rollResult.total;
                    fullFormula += formula; 
                    
                    const breakdownPart = `<strong>Custom Roll</strong> (<em style="color: currentColor;">${formula}</em>)<span style="color: currentColor;">:</span> ${rollResult.breakdown}`;
                    combinedBreakdown.push(breakdownPart);
                    rollExecuted = true;
                    
                    // Clear the custom input after successful use in a compound roll
                    customRollInputEl.value = '';

                } else if (toggledMacros.length === 0) {
                    // If only invalid custom roll is present and no macros are checked, show error.
                    updateResultUI('INVALID', customRollInput, 'Invalid format. Use XdY+Z (e.g., 2d6+5 or d20).');
                    return;
                }
                // If the custom roll is invalid but macros are checked, we just ignore the custom input and proceed to macros.
            }


            // 2. Process Toggled Macros
            toggledMacros.forEach((checkbox) => {
                const macroFormula = checkbox.getAttribute('data-formula');
                const macroName = checkbox.getAttribute('data-macro-name');
                const parsed = parseCustomRollString(macroFormula);

                if (parsed.success) {
                    const macroRoll = rollAndCalculate(parsed.numDice, parsed.dieSize, parsed.modifier);
                    
                    combinedTotal += macroRoll.total;
                    fullFormula += (fullFormula ? ' + ' : '') + `(${macroFormula})`; 
                    
                    const macroBreakdownPart = `<strong>${macroName}</strong> (<em style="color: currentColor;">${macroFormula}</em>)<span style="color: currentColor;">:</span> ${macroRoll.breakdown}`;
                    combinedBreakdown.push(macroBreakdownPart);
                    rollExecuted = true;
                    
                    // Uncheck the macro after using it in a compound roll
                    checkbox.checked = false;
                } else {
                    console.error("Invalid macro formula skipped:", macroFormula);
                }
            });

            // 3. Final Check and Execution
            if (!rollExecuted) {
                updateResultUI('0', 'N/A', 'Enter a custom roll or check at least one macro to execute.');
                return;
            }

            // 4. Update UI and Save History
            const historyFormula = fullFormula + ' [COMPOUND]';
            // Join parts with pipe 
            const finalBreakdown = combinedBreakdown.join(' <span style="color: currentColor;">|</span> ');
            
            updateResultUI(combinedTotal, historyFormula, finalBreakdown);
            saveRoll(combinedTotal, historyFormula, finalBreakdown);
        }


        /**
         * Main function for the single custom roll input ("Roll Now" button).
         */
        window.handleAdvancedRoll = function() {
            const inputEl = document.getElementById('customRollInput');
            const input = inputEl.value;
            const parsed = parseCustomRollString(input);

            if (!parsed.success) {
                updateResultUI('INVALID', input, 'Invalid format. Use XdY+Z (e.g., 2d6+5 or d20).');
                return;
            }

            const formula = `${parsed.numDice}d${parsed.dieSize}${parsed.modifier >= 0 ? '+' : ''}${parsed.modifier}`;
            const { total, breakdown } = rollAndCalculate(parsed.numDice, parsed.dieSize, parsed.modifier);

            updateResultUI(total, formula, breakdown);
            saveRoll(total, formula, breakdown);
            
            // Clear the custom input only after a successful single roll
            inputEl.value = ''; 
        }


        /**
         * Sets up the real-time listener for roll history.
         */
        function loadHistory() {
            if (!db || !userId) {
                console.error("Database or User ID not available for history loading.");
                return;
            }

            const historyCollectionRef = collection(db, 'artifacts', appId, 'users', userId, HISTORY_COLLECTION);
            const rollsQuery = query(historyCollectionRef);

            // Real-time listener
            onSnapshot(rollsQuery, (snapshot) => {
                const historyList = document.getElementById('historyList');
                historyList.innerHTML = ''; // Clear existing list

                const rolls = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    // Ensure timestamp exists before using toISOString (it might be null if serverTimestamp is pending)
                    const dateStr = data.timestamp ? new Date(data.timestamp.toDate()).toLocaleTimeString() : '...';
                    rolls.push({ ...data, dateStr, id: doc.id });
                });

                // Sort the history by timestamp (newest first)
                rolls.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));

                if (rolls.length === 0) {
                    historyList.innerHTML = '<p class="text-gray-500 text-center py-4">No rolls recorded yet.</p>';
                    return;
                }

                rolls.forEach(roll => {
                    const item = document.createElement('div');
                    item.className = 'history-item p-3 rounded-lg border border-gray-700 hover:border-fuchsia-400 cursor-pointer';

                    // Apply color logic: Critical, Fumble, Compound, or Default
                    let totalClass = 'text-cyan-400';
                    if (roll.formula.includes('[COMPOUND]')) {
                         totalClass = 'text-fuchsia-400';
                    } else if (roll.formula.toLowerCase() === '1d20+0') {
                        if (roll.total === 20) {
                            totalClass = 'text-green-400';
                        } else if (roll.total === 1) {
                            totalClass = 'text-red-400';
                        }
                    }

                    item.innerHTML = `
                        <div class="flex justify-between items-center">
                            <span class="text-lg font-bold ${totalClass}">${roll.total}</span>
                            <span class="text-sm text-fuchsia-400 font-orbitron">${roll.formula.replace(' [COMPOUND]', '')}</span>
                        </div>
                        <!-- NOTE: We use innerHTML here to allow the stored breakdown (which contains the styled spans) to render -->
                        <p class="text-xs text-gray-400 mt-1 truncate">${roll.breakdown}</p>
                        <p class="text-xs text-gray-500 mt-1">${roll.dateStr}</p>
                    `;
                    historyList.appendChild(item);
                });

            }, (error) => {
                console.error("Error listening to history changes:", error);
                document.getElementById('loadingHistory').textContent = 'Error loading history. Check connection.';
            });
        }
        
        // Initialize the default selection highlight and add event listeners on window load
        window.onload = () => {
             // Delay to ensure DOM is fully rendered
             setTimeout(() => {
                const defaultButton = document.getElementById(`d${currentDieSize}`);
                if (defaultButton) {
                    defaultButton.classList.add('selected');
                }
                
                // Attach event listener for the top "EXECUTE ROLL (XdY+Z + Macros)" button
                const executeStandardRollBtn = document.getElementById('executeStandardRollBtn');
                if(executeStandardRollBtn) {
                    executeStandardRollBtn.addEventListener('click', window.handleStandardCompoundRoll);
                }
                
                // Attach event listener for the new "EXECUTE CUSTOM & MACRO ROLL" button
                const executeMacroRollBtn = document.getElementById('executeMacroRollBtn');
                if(executeMacroRollBtn) {
                    executeMacroRollBtn.addEventListener('click', window.handleCustomMacroExecution);
                }
             }, 100);
        };
    </script>
</body>
</html>
